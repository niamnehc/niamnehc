<svg xmlns="http://www.w3.org/2000/svg" width="780" height="484" viewBox="0 0 780 484" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif">
<rect x="0" y="12" width="780" height="34" rx="8" fill="#2D333B"/>
<rect x="12" y="18" width="6" height="22" rx="3" fill="#F7782B"/>
<text x="30" y="35" font-size="13" font-weight="bold" fill="#F7782B">#01</text>
<text x="64" y="35" font-size="13" fill="#E6EDF3">公司账上的钱越来越多，别人非说你亏得要死，说我们要爆雷了，我非常困惑。我还不知道我亏没亏钱吗？</text>
<rect x="0" y="50" width="780" height="34" rx="8" fill="#2D333B"/>
<rect x="12" y="56" width="6" height="22" rx="3" fill="#FF4D4D"/>
<text x="30" y="73" font-size="13" font-weight="bold" fill="#FF4D4D">#04</text>
<text x="64" y="73" font-size="13" fill="#E6EDF3">这个我上次说过——为什么还不改——就放着——就让用户看着？</text>
<rect x="0" y="88" width="780" height="34" rx="8" fill="#2D333B"/>
<rect x="12" y="94" width="6" height="22" rx="3" fill="#8A2BE2"/>
<text x="30" y="111" font-size="13" font-weight="bold" fill="#8A2BE2">#05</text>
<text x="64" y="111" font-size="13" fill="#E6EDF3">这样下去公司要倒闭了！</text>
<rect x="0" y="126" width="780" height="34" rx="8" fill="#2D333B"/>
<rect x="12" y="132" width="6" height="22" rx="3" fill="#00C4FF"/>
<text x="30" y="149" font-size="13" font-weight="bold" fill="#00C4FF">#08</text>
<text x="64" y="149" font-size="13" fill="#E6EDF3">我司近期没有联创离开（未来也不会有）。</text>
<rect x="0" y="164" width="780" height="34" rx="8" fill="#2D333B"/>
<rect x="12" y="170" width="6" height="22" rx="3" fill="#F7782B"/>
<text x="30" y="187" font-size="13" font-weight="bold" fill="#F7782B">#11</text>
<text x="64" y="187" font-size="13" fill="#E6EDF3">回字节打工吧。</text>
<rect x="0" y="202" width="780" height="34" rx="8" fill="#2D333B"/>
<rect x="12" y="208" width="6" height="22" rx="3" fill="#FF4D4D"/>
<text x="30" y="225" font-size="13" font-weight="bold" fill="#FF4D4D">#15</text>
<text x="64" y="225" font-size="13" fill="#E6EDF3">用户买了 100 万积分，实际只用 20 万，剩下 80 万是我们的利润。</text>
<rect x="0" y="240" width="780" height="34" rx="8" fill="#2D333B"/>
<rect x="12" y="246" width="6" height="22" rx="3" fill="#8A2BE2"/>
<text x="30" y="263" font-size="13" font-weight="bold" fill="#8A2BE2">#16</text>
<text x="64" y="263" font-size="13" fill="#E6EDF3">我们没咋投流……我们的收入只有 3-4% 是投流带来的。</text>
<rect x="0" y="278" width="780" height="34" rx="8" fill="#2D333B"/>
<rect x="12" y="284" width="6" height="22" rx="3" fill="#00C4FF"/>
<text x="30" y="301" font-size="13" font-weight="bold" fill="#00C4FF">#27</text>
<text x="64" y="301" font-size="13" fill="#E6EDF3">你要追求长期主义，先问自己账上有没有一百亿美金吧。</text>
<rect x="0" y="316" width="780" height="34" rx="8" fill="#2D333B"/>
<rect x="12" y="322" width="6" height="22" rx="3" fill="#F7782B"/>
<text x="30" y="339" font-size="13" font-weight="bold" fill="#F7782B">#40</text>
<text x="64" y="339" font-size="13" fill="#E6EDF3">我们团队没有产品经理，只有设计师。</text>
<rect x="0" y="354" width="780" height="34" rx="8" fill="#2D333B"/>
<rect x="12" y="360" width="6" height="22" rx="3" fill="#FF4D4D"/>
<text x="30" y="377" font-size="13" font-weight="bold" fill="#FF4D4D">#53</text>
<text x="64" y="377" font-size="13" fill="#E6EDF3">事实证明，不焦虑的人做不好 AI 应用。</text>
<rect x="0" y="392" width="780" height="34" rx="8" fill="#2D333B"/>
<rect x="12" y="398" width="6" height="22" rx="3" fill="#8A2BE2"/>
<text x="30" y="415" font-size="13" font-weight="bold" fill="#8A2BE2">#65</text>
<text x="64" y="415" font-size="13" fill="#E6EDF3">我不是为了创业而创业，是为了赢而创业。</text>
<rect x="0" y="430" width="780" height="34" rx="8" fill="#2D333B"/>
<rect x="12" y="436" width="6" height="22" rx="3" fill="#00C4FF"/>
<text x="30" y="453" font-size="13" font-weight="bold" fill="#00C4FF">#66</text>
<text x="64" y="453" font-size="13" fill="#E6EDF3">侥幸得来的都会还回去。</text>
</svg>